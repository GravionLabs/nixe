name: Build & Release

on:
  push:
    branches: [main]
  # only the release pull request builds the installer matrix; other pull requests run ci.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          gitversion-config-file: GitVersion.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Push to main (the merge of the release PR): git-cliff writes CHANGELOG.md and commits it to main ([skip ci]),
  # the version is tagged, the GitHub release is created with the git-cliff notes and the issues delivered by the
  # release PR are closed (GravionLabs/ci gh-release, as in poimen). The release stays a draft until publish-release.
  # GH_PAT pushes the changelog commit past the main ruleset.
  release:
    needs: [determine-version, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release-id.outputs.id }}
    permissions:
      contents: write # changelog commit, tag, GitHub release
      issues: write # close-issues
      pull-requests: read # close-issues reads the release PR
    steps:
      - name: Create GitHub release
        uses: GravionLabs/ci/versioning/gh-release@511932d4b5d0d7c77149bb705cfc2b6bae5f2df1 # v1.15.0
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: "true"
          close-issues: "true"
          token: ${{ secrets.GH_PAT }}

      # The installers are uploaded to this release (tauri-action releaseId).
      - name: Find the release id
        id: release-id
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.determine-version.outputs.semver }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # Hidden until every installer is built and verified; publish-release makes it public.
          gh release edit "$TAG" --draft --repo "$GITHUB_REPOSITORY"

  build:
    needs: [determine-version, test, release]
    if: ${{ !cancelled() && needs.determine-version.result == 'success' && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.determine-version.outputs.semver }}
      # Only a push to main publishes a release and signs/notarizes the macOS bundles.
      # PRs, workflow_dispatch and other branches build unsigned, publish nothing and get no Apple secret.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIGN_MACOS: ${{ startsWith(matrix.platform, 'macos') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require the updater signing key
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set; refusing to publish without signed update packages"; exit 1; }
      - name: Require the Apple signing secrets
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set; refusing to publish an unsigned macOS bundle"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Set release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
          "
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Export the signing variables and write the App Store Connect API key
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          # Placed after `pnpm install` so no install script or earlier build step sees the signing variables.
          # Tauri checks that these variables exist, not that they are non-empty, so they are exported only
          # on a signing run and never set to '' on unsigned runs. Each value is written with a random
          # delimiter, so line breaks in a value cannot end the entry or inject another variable.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "$name<<$delimiter"
              printf '%s\n' "${!name}"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          done
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (updater key pair, docs/updater.md); only a publish gets the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # Only builds from main upload to the draft release created by the release job; PRs and other
          # branches just build, to validate the matrix. publish-release publishes it once all four are done.
          releaseId: ${{ env.PUBLISH == 'true' && needs.release.outputs.release-id || '' }}
          # The MSI bundler rejects pre-release versions (1.1.0-rc021), so a pre-release builds
          # the Windows installer as NSIS only; stable versions keep every bundle target.
          # createUpdaterArtifacts is set only by the release config, so local builds and PR builds need no key.
          args: ${{ matrix.args }}${{ env.PUBLISH == 'true' && ' --config src-tauri/tauri.release.conf.json' || '' }}${{ matrix.platform == 'windows-latest' && contains(env.VERSION, '-') && ' --bundles nsis' || '' }}
      - name: Verify signature and notarization
        if: env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/*/release/bundle/macos/*.app)
          [ "${#apps[@]}" -gt 0 ] || { echo "::error::no .app bundle found"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv "$app" 2>&1)
            grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::$app has no hardened runtime"; exit 1; }
            xcrun stapler validate "$app"
            spctl -a -vv "$app"
          done
      - name: Remove the API key
        if: always() && env.SIGN_MACOS == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # The browser extension: built and zipped on every run, attached to the draft release on a push to main.
  # The store upload is manual (docs/releasing.md).
  extension:
    needs: [determine-version, test, release]
    if: ${{ !cancelled() && needs.determine-version.result == 'success' && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release.result) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.determine-version.outputs.semver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nixe-extension build
      - name: Zip the packages
        run: |
          set -euo pipefail
          for browser in chromium firefox; do
            # manifest.json is at the root of the archive, as both stores expect.
            (cd "extension/dist/$browser" && zip -qr "$RUNNER_TEMP/nixe-extension-$browser-$VERSION.zip" .)
          done
      - name: Attach the packages to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" \
            "$RUNNER_TEMP/nixe-extension-chromium-$VERSION.zip" \
            "$RUNNER_TEMP/nixe-extension-firefox-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: [determine-version, build, extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write, check and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.determine-version.outputs.semver }}"
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$tag" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/assets"
          bash scripts/release-checksums.sh "$RUNNER_TEMP/assets"
          gh release upload "$tag" "$RUNNER_TEMP/assets/SHA256SUMS" --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [determine-version, build, extension, checksums]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.determine-version.outputs.semver }}" \
            --repo "${{ github.repository }}" \
            --draft=false
