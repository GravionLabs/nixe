<div class="group">
  <button
    type="button"
    class="icon"
    [class.active]="settings.sidebarVisible()"
    [disabled]="!workspace.root()"
    (click)="settings.sidebarVisible.set(!settings.sidebarVisible())"
    [title]="'Toggle sidebar (' + mod + 'B)'"
    aria-label="Toggle sidebar"
  >
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
  </button>
  <span class="sep"></span>
  <button type="button" class="icon" (click)="doc.openWithDialog()" [title]="'Open file (' + mod + 'O)'" aria-label="Open file">
    <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></svg>
  </button>
  <button type="button" class="icon" (click)="workspace.openFolderWithDialog()" [title]="'Open folder (' + mod + '⇧O)'" aria-label="Open folder">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
  </button>
  <span class="sep"></span>
  <button type="button" class="icon" (click)="doc.back()" [disabled]="!doc.canGoBack()" [title]="'Back (' + mod + '[)'" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
  </button>
  <button type="button" class="icon" (click)="doc.forward()" [disabled]="!doc.canGoForward()" [title]="'Forward (' + mod + '])'" aria-label="Forward">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
  </button>
</div>

<div class="title" [title]="doc.path() ?? ''">
  <span class="name">{{ doc.fileName() }}</span>
</div>

<div class="group">
  <button
    type="button"
    class="toggle"
    [class.active]="settings.math()"
    [attr.aria-pressed]="settings.math()"
    (click)="settings.math.set(!settings.math())"
    title="Toggle LaTeX math (KaTeX)"
  >
    ∑ LaTeX
  </button>
  <button type="button" class="toggle" (click)="settings.cycleTheme()" [title]="'Theme: ' + themeLabel()">
    @switch (settings.themeMode()) {
      @case ("light") {
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      }
      @case ("dark") {
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      }
      @default {
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
      }
    }
    {{ themeLabel() }}
  </button>
</div>
