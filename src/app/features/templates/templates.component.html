<div class="backdrop" (click)="templates.close()" (keydown.escape)="templates.close()" role="presentation"></div>
<div class="dialog" role="dialog" aria-label="Insert template">
  <input
    #input
    type="text"
    placeholder="Insert template…"
    aria-label="Find a template by name"
    role="combobox"
    aria-expanded="true"
    aria-controls="templates-list"
    [value]="templates.query()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  <ul id="templates-list" role="listbox">
    @for (entry of templates.matches(); track entry.path; let i = $index) {
      <li role="option" [attr.aria-selected]="i === templates.selected()" [class.selected]="i === templates.selected()">
        <button type="button" tabindex="-1" (click)="choose(entry)" [title]="entry.path">
          <span class="name">{{ entry.name }}</span>
          <span class="path">{{ entry.path }}</span>
        </button>
      </li>
    } @empty {
      <li class="empty">No matching template</li>
    }
  </ul>
</div>
