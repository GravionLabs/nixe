@if (findOpen()) {
  <div class="find-bar" role="search" (keydown)="onFindKeydown($event)">
    <input
      #findInput
      hx-input
      type="text"
      size="small"
      class="find-input"
      placeholder="Find"
      aria-label="Find in note"
      [value]="findQuery()"
      (input)="setFindQuery($any($event.target).value)"
    />
    <span class="find-count" aria-live="polite">{{ findStatus() }}</span>
    <button
      hx-button
      type="button"
      variant="text"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Previous match"
      aria-label="Previous match"
      (click)="findStep(-1)"
    >
      <span aria-hidden="true">↑</span>
    </button>
    <button
      hx-button
      type="button"
      variant="text"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Next match"
      aria-label="Next match"
      (click)="findStep(1)"
    >
      <span aria-hidden="true">↓</span>
    </button>
    <button
      hx-button
      type="button"
      class="find-case"
      [variant]="findCase() ? 'outlined' : 'text'"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Match case"
      aria-label="Match case"
      [attr.aria-pressed]="findCase()"
      (click)="toggleFindOption('case')"
    >
      <span aria-hidden="true">Aa</span>
    </button>
    <button
      hx-button
      type="button"
      class="find-regex"
      [variant]="findRegex() ? 'outlined' : 'text'"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Regular expression"
      aria-label="Regular expression"
      [attr.aria-pressed]="findRegex()"
      (click)="toggleFindOption('regex')"
    >
      <span aria-hidden="true">.*</span>
    </button>
    <button
      hx-button
      type="button"
      variant="text"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Close"
      aria-label="Close find bar"
      (click)="closeFind()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </div>
}
<app-properties
  class="properties-host"
  [style.zoom.%]="settings.zoom()"
  (failed)="notify.emit($event)"
/>
<article
  #content
  class="markdown-body"
  [class.wrap-code]="settings.wrapCode()"
  tabindex="-1"
  [style.zoom.%]="settings.zoom()"
  (click)="onClick($event)"
  (keydown)="onContentKeydown($event)"
  (contextmenu)="onContextMenu($event)"
  (wheel)="onWheel($event)"
  (mousemove)="onHover($event)"
  (mouseleave)="preview.leave()"
></article>

<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- a click outside the dialog closes it; the keyboard closes it with Escape (onDialogKeydown) -->
<div
  class="diagram-dialog-backdrop"
  [class.open]="dialogOpen()"
  (click)="closeDiagram()"
  (wheel)="onDialogWheel($event)"
>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- only keeps a click inside the dialog from closing it -->
  <div class="diagram-dialog" (click)="$event.stopPropagation()">
    <div class="diagram-dialog-toolbar">
      <button
        hx-button
        type="button"
        variant="text"
        severity="secondary"
        size="small"
        iconOnly
        hx-tooltip="Zoom out"
        aria-label="Zoom out"
        (click)="dialogZoomOut()"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.35-4.35M8 11h6" />
        </svg>
      </button>
      <button
        hx-button
        type="button"
        class="zoom-level"
        variant="text"
        severity="secondary"
        size="small"
        hx-tooltip="Reset zoom"
        (click)="resetDialogZoom()"
      >
        {{ dialogZoomPercent() }}%
      </button>
      <button
        hx-button
        type="button"
        variant="text"
        severity="secondary"
        size="small"
        iconOnly
        hx-tooltip="Zoom in"
        aria-label="Zoom in"
        (click)="dialogZoomIn()"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.35-4.35M11 8v6M8 11h6" />
        </svg>
      </button>
      @if (dialogFile(); as file) {
        <button
          hx-button
          type="button"
          variant="text"
          severity="secondary"
          size="small"
          (click)="openDialogFile(file)"
        >
          Open with default app
        </button>
        <button
          hx-button
          type="button"
          variant="text"
          severity="secondary"
          size="small"
          (click)="revealDialogFile(file)"
        >
          {{ revealText }}
        </button>
      }
    </div>
    <button
      hx-button
      type="button"
      class="close"
      variant="text"
      severity="secondary"
      size="small"
      iconOnly
      hx-tooltip="Close"
      aria-label="Close"
      (click)="closeDiagram()"
    >
      <span aria-hidden="true">✕</span>
    </button>
    <div
      class="diagram-dialog-viewport"
      [class.panning]="panning()"
      (pointerdown)="onPanStart($event)"
      (pointermove)="onPanMove($event)"
      (pointerup)="onPanEnd($event)"
      (pointercancel)="onPanEnd($event)"
    >
      <div #dialogContent class="diagram-dialog-content"></div>
    </div>
  </div>
</div>

<hx-menu #imageMenu popup ariaLabel="Image" [model]="imageMenuItems" />
