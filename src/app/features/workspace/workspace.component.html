@for (pane of tabs.panes(); track pane.id; let i = $index) {
  @if (i > 0) {
    <div
      class="divider"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panes"
      tabindex="0"
      [attr.aria-valuemin]="minPercent"
      [attr.aria-valuemax]="maxPercent"
      [attr.aria-valuenow]="percent()"
      (pointerdown)="startDrag($event)"
      (pointermove)="drag($event)"
      (keydown)="dividerKey($event)"
    ></div>
  }
  <section
    class="pane"
    [class.focused]="tabs.split() && pane.id === tabs.focusedPane().id"
    [style.flex]="tabs.split() ? (i === 0 ? '0 0 ' + tabs.ratio() * 100 + '%' : '1 1 0') : '1 1 0'"
    (pointerdown)="tabs.focusPane(pane.id)"
    (focusin)="tabs.focusPane(pane.id)"
  >
    <div class="tabbar" role="tablist">
      @for (tab of pane.tabs; track tab.id) {
        <div class="tab" role="presentation" [class.active]="tab.id === pane.activeId">
          <button
            type="button"
            role="tab"
            class="label"
            [attr.aria-selected]="tab.id === pane.activeId"
            [title]="tab.doc.path() ?? 'New tab'"
            (click)="tabs.activate(pane.id, tab.id)"
            (auxclick)="middleClose($event, pane, tab)"
          >
            {{ title(tab) }}
          </button>
          <button type="button" class="close" aria-label="Close tab" (click)="closeTab($event, pane, tab)">✕</button>
        </div>
      }
      <button type="button" class="new" aria-label="New tab" title="New tab" (click)="addTab(pane)">+</button>
    </div>
    @for (tab of [shown(pane)]; track tab.id) {
      <ng-container *ngComponentOutlet="paneType; injector: tab.injector" />
    }
  </section>
}
