<hx-dialog [visible]="true" (hidden)="switcher.close()" ariaLabel="Quick switcher" [closable]="false" dismissableMask position="top" width="min(560px, 90vw)">
  <input
    #input
    type="text"
    placeholder="Open note…"
    aria-label="Find a note by name or alias"
    role="combobox"
    aria-expanded="true"
    aria-controls="switcher-list"
    [value]="switcher.query()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  <ul id="switcher-list" role="listbox">
    @for (match of switcher.matches(); track match.entry.path; let i = $index) {
      <li role="option" [attr.aria-selected]="i === switcher.selected()" [class.selected]="i === switcher.selected()">
        <button type="button" tabindex="-1" (click)="choose(match)" [title]="match.entry.path">
          <span class="name">@for (part of parts(match.label, match.positions); track $index) {<span [class.hit]="part.matched">{{ part.text }}</span>}</span>
          @if (match.isAlias) {
            <span class="alias">alias of {{ match.entry.title }}</span>
          }
          <span class="path" [title]="match.entry.path">{{ match.entry.path }}</span>
        </button>
      </li>
    } @empty {
      <li class="empty">
        @if (switcher.query().trim()) {
          <button type="button" (click)="create()">Create “{{ switcher.query().trim() }}” (Enter)</button>
        } @else {
          No notes
        }
      </li>
    }
  </ul>
  <div class="status" role="status" aria-live="polite">{{ announcement() }}</div>
  @if (switcher.truncated()) {
    <div class="more">More notes match; type more to narrow the list.</div>
  }
  <app-key-hints [hints]="hints()" />
</hx-dialog>
