@if (conflict() !== null) {
  <div class="bar" role="alert">
    <span class="message">
      This note changed on disk while you were editing.
      <span class="hints">
        <b>Reload</b> discards your unsaved edits. <b>Keep mine</b> replaces the version on disk
        with your next save.
      </span>
    </span>
    <button
      hx-button
      type="button"
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="reloadFromDisk()"
    >
      Reload
    </button>
    <button
      hx-button
      type="button"
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="keepMine()"
    >
      Keep mine
    </button>
    <button
      hx-button
      type="button"
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="compare()"
    >
      Compare
    </button>
  </div>
}
@if (comparing() !== null) {
  <app-external-compare
    [disk]="conflict() ?? ''"
    [mine]="comparing() ?? ''"
    (reload)="chooseReload()"
    (keep)="chooseKeep()"
    (closed)="closeCompare()"
  />
}
<div #host class="host"></div>
