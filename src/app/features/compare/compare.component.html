@if (input(); as c) {
  <header class="head">
    <h1 class="title">{{ c.title }}</h1>
    <span class="stat" aria-label="Changed lines">
      <span class="add">+{{ stat().added }}</span>
      <span class="del">−{{ stat().removed }}</span>
    </span>
    <span class="range">{{ c.oldLabel }} → {{ c.newLabel }}</span>
    <hx-select-button
      class="modes"
      ariaLabel="Compare view"
      size="small"
      [options]="modes"
      [value]="compare.mode()"
      [allowEmpty]="false"
      (valueChange)="compare.setMode($any($event))"
    />
    @if (c.action; as action) {
      <span class="action">
        <span class="note">{{ action.note }}</span>
        <button hx-button type="button" size="small" [loading]="busy()" (click)="act()">
          {{ action.label }}
        </button>
      </span>
    }
  </header>
  <app-diff
    class="body"
    [oldText]="c.oldText"
    [newText]="c.newText"
    [oldLabel]="c.oldLabel"
    [newLabel]="c.newLabel"
    [mode]="compare.mode()"
  />
} @else {
  <app-empty-state text="Nothing to compare" />
}
