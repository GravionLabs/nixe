<app-panel-section title="Changes since" storageKey="changes-since">
  <div class="range" role="group" aria-label="Range">
    <button type="button" [class.on]="changes.kind() === 'sync'" (click)="changes.showSync()">
      Last sync
    </button>
    <button
      type="button"
      [class.on]="changes.kind() === 'yesterday'"
      (click)="changes.showYesterday()"
    >
      Yesterday
    </button>
    <button type="button" [class.on]="changes.kind() === 'commit'" (click)="commit.focus()">
      Commit
    </button>
  </div>
  <form class="commit" (submit)="$event.preventDefault(); changes.showCommit(commit.value)">
    <input #commit type="text" aria-label="Commit id" placeholder="Commit id" />
    <button type="submit">Show</button>
  </form>

  @if (changes.message(); as message) {
    <p class="status">{{ message }}</p>
  }
  @if (changes.loading()) {
    <p class="status">Loading…</p>
  }
  <ul class="list" aria-label="Changed notes">
    @for (change of changes.changes(); track change.path) {
      <li>
        <app-note-row
          [path]="change.path"
          [kind]="change.kind"
          (activated)="changes.compare(change)"
        >
          @if (change.kind !== "deleted") {
            <button rowActions type="button" class="open" (click)="open(change)">Open</button>
          }
        </app-note-row>
      </li>
    } @empty {
      @if (!changes.loading() && !changes.message()) {
        <li><app-empty-state text="No notes changed" /></li>
      }
    }
  </ul>
</app-panel-section>
