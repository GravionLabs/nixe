<hx-dialog
  [visible]="true"
  (hidden)="onHidden()"
  header="Set folder role"
  dismissableMask
  position="top"
  size="md"
>
  @if (dialog(); as d) {
    <form id="folder-role-form" (submit)="submit($event)">
      <p class="folder" [title]="d.rel">{{ basename(d.rel) }}</p>
      <hx-field label="Role">
        <input
          hx-input
          type="text"
          list="folder-role-names"
          autocomplete="off"
          spellcheck="false"
          placeholder="inbox, or an own name"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
        />
        <datalist id="folder-role-names">
          @for (role of standard; track role) {
            <option [value]="role"></option>
          }
        </datalist>
      </hx-field>
      <hx-field [label]="'Description' + (needsDescription() ? ' (required for an own role)' : '')">
        <input
          hx-input
          type="text"
          autocomplete="off"
          placeholder="What belongs into this folder"
          [value]="description()"
          (input)="description.set($any($event.target).value)"
        />
      </hx-field>
      @if (error()) {
        <hx-message severity="error">{{ error() }}</hx-message>
      }
    </form>
  }

  <div hxDialogFooter>
    <button hx-button type="button" variant="text" (click)="onHidden()">Cancel</button>
    @if (dialog()?.current) {
      <button hx-button type="button" variant="outlined" severity="danger" (click)="remove()">
        Remove folder role
      </button>
    }
    <button hx-button type="submit" form="folder-role-form">Save</button>
  </div>
</hx-dialog>
