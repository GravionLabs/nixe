@if (workspaces.rootChoice(); as pending) {
  <hx-dialog
    [visible]="true"
    (hidden)="workspaces.cancelRootChoice()"
    header="Add folder to workspace"
    dismissableMask
    position="top"
    size="md"
  >
    <form id="root-choice-form" class="choice" (submit)="submit($event)">
      <hx-fieldset legend="Store this folder as">
        <p>A path on this device, or a path relative to a location variable.</p>
        <label>
          <input
            type="radio"
            hx-radio
            name="root-form"
            [checked]="selected() === null"
            (change)="selected.set(null)"
          />
          <span class="form">Absolute path</span>
          <span class="path">{{ pending.path }}</span>
        </label>
        @for (choice of pending.choices; track choice.name) {
          <label>
            <input
              type="radio"
              hx-radio
              name="root-form"
              [checked]="selected() === choice.template"
              (change)="selected.set(choice.template)"
            />
            <span class="form">{{ choice.template }}</span>
            <span class="path">{{ choice.resolved }}</span>
          </label>
        }
      </hx-fieldset>
    </form>

    <div hxDialogFooter>
      <button hx-button type="button" variant="text" (click)="workspaces.cancelRootChoice()">
        Cancel
      </button>
      <button hx-button type="submit" form="root-choice-form">Add folder</button>
    </div>
  </hx-dialog>
}
