<hx-app-toolbar>
  <button
    slot="start"
    type="button"
    class="icon"
    (click)="doc.back()"
    [disabled]="!doc.canGoBack()"
    hx-tooltip="Back"
    [hxTooltipShortcut]="shortcuts.keys('back')"
    aria-label="Back"
  >
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
  </button>
  <button
    slot="start"
    type="button"
    class="icon"
    (click)="doc.forward()"
    [disabled]="!doc.canGoForward()"
    hx-tooltip="Forward"
    [hxTooltipShortcut]="shortcuts.keys('forward')"
    aria-label="Forward"
  >
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
  </button>

  <nav slot="centre" class="crumbs" aria-label="Path of the note" [hx-tooltip]="doc.path() ?? ''">
    @for (crumb of crumbs(); track $index) {
      @if ($index > 0) {
        <span class="sep" aria-hidden="true">/</span>
      }
      @switch (crumb.kind) {
        @case ("folder") {
          <button type="button" class="crumb folder" (click)="revealFolder(crumb.dir!)">
            {{ crumb.label }}
          </button>
        }
        @case ("ellipsis") {
          <span class="crumb gap">{{ crumb.label }}</span>
        }
        @default {
          @if (renaming()) {
            <input
              #renameInput
              class="rename"
              aria-label="Rename note"
              [value]="crumb.label"
              (keydown.enter)="commitRename(renameInput)"
              (keydown.escape)="cancelRename()"
              (blur)="commitRename(renameInput)"
            />
          } @else {
            <button type="button" class="crumb note" hx-tooltip="Rename" (click)="startRename()">
              {{ crumb.label }}
            </button>
          }
        }
      }
    }
  </nav>

  <div slot="end" class="modes" role="group" aria-label="View mode">
    @for (m of modes; track m.id) {
      <button
        type="button"
        class="icon toggle"
        [class.active]="editor.mode() === m.id"
        [attr.aria-pressed]="editor.mode() === m.id"
        [attr.aria-label]="m.label"
        [disabled]="modeDisabled()"
        (click)="run('view-' + m.id)"
        [hx-tooltip]="m.label"
        [hxTooltipShortcut]="shortcuts.keys(m.shortcut)"
      >
        <svg viewBox="0 0 24 24"><path [attr.d]="m.icon" /></svg>
      </button>
    }
  </div>
  <button
    slot="end"
    type="button"
    class="icon props"
    [class.active]="settings.propertiesDisplay() !== 'hidden'"
    [attr.aria-pressed]="settings.propertiesDisplay() !== 'hidden'"
    [disabled]="doc.path() === null"
    (click)="run('toggle-properties')"
    hx-tooltip="Toggle properties in document"
    [hxTooltipShortcut]="shortcuts.keys('toggle-properties')"
    aria-label="Toggle properties in document"
  >
    <svg viewBox="0 0 24 24"><path d="M4 7h3M11 7h9M4 12h9M17 12h3M4 17h5M13 17h7" /></svg>
  </button>
  <button
    slot="end"
    type="button"
    class="icon"
    [class.active]="settings.outlineVisible()"
    [attr.aria-pressed]="settings.outlineVisible()"
    [disabled]="doc.path() === null"
    (click)="run('toggle-outline')"
    hx-tooltip="Toggle outline"
    [hxTooltipShortcut]="shortcuts.keys('toggle-outline')"
    aria-label="Toggle outline"
  >
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
  </button>
  <button
    slot="end"
    type="button"
    class="icon"
    [class.active]="settings.backlinksVisible()"
    [attr.aria-pressed]="settings.backlinksVisible()"
    [disabled]="workspace.vaultRoot() === null || doc.path() === null"
    (click)="run('toggle-backlinks')"
    hx-tooltip="Toggle backlinks"
    [hxTooltipShortcut]="shortcuts.keys('toggle-backlinks')"
    aria-label="Toggle backlinks"
  >
    <svg viewBox="0 0 24 24">
      <path
        d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"
      />
    </svg>
  </button>
</hx-app-toolbar>
