<app-panel-section title="Suggestions" [count]="review.count()" storageKey="review">
  @if (review.error(); as error) {
    <p class="status" role="alert">{{ error }}</p>
  }
  @if (review.result(); as result) {
    <p class="status" role="status">{{ result }}</p>
  }
  <hx-list class="cards" aria-label="Suggestions waiting for review">
    @for (branch of review.branches(); track branch.name) {
      <button
        hx-list-row
        type="button"
        class="card"
        [current]="review.open()?.name === branch.name"
        [title]="branch.name"
        (click)="open(branch)"
      >
        <span class="card-body">
          <span class="who">{{ branch.author }}</span>
          <span class="meta">
            {{ time(branch.time) }} · {{ branch.notes }}
            {{ branch.notes === 1 ? "note" : "notes" }}
          </span>
          <span class="messages">
            @for (message of branch.messages; track $index) {
              <span class="message">{{ message }}</span>
            }
          </span>
        </span>
      </button>
    } @empty {
      <app-empty-state text="No suggestions to review" />
    }
  </hx-list>
</app-panel-section>
