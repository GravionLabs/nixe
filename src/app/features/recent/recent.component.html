<hx-dialog [visible]="true" (hidden)="picker.close()" ariaLabel="Open recent vault" [closable]="false" dismissableMask position="top" width="min(560px, 90vw)">
  <ul #list id="recent-list" role="listbox" tabindex="0" aria-label="Recent vaults" (keydown)="onKeydown($event)">
    @for (path of picker.vaults(); track path; let i = $index) {
      <li role="option" [attr.aria-selected]="i === picker.selected()" [class.selected]="i === picker.selected()">
        <button type="button" tabindex="-1" (click)="picker.choose(path)">
          <span class="name">{{ name(path) }}</span>
          <span class="path">{{ path }}</span>
        </button>
      </li>
    } @empty {
      <li class="empty">No recent vaults</li>
    }
  </ul>
</hx-dialog>
