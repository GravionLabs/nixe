@if (conflict.pair(); as pair) {
  <div class="bar" role="alert">
    <span class="text">
      @if (conflict.isCopy()) {
        This is your version from the sync conflict.
      } @else {
        This note changed on two devices. Your version is saved as
      }
      <a href="#" class="link" (click)="open($event)">{{ basename(conflict.other() ?? "") }}</a>
    </span>
    <button
      hx-button
      variant="outlined"
      severity="secondary"
      size="small"
      type="button"
      (click)="merge()"
    >
      Merge
    </button>
    <button
      hx-button
      variant="outlined"
      severity="secondary"
      size="small"
      type="button"
      (click)="keep('this')"
    >
      Keep this one
    </button>
    <button
      hx-button
      variant="outlined"
      severity="secondary"
      size="small"
      type="button"
      (click)="keep('other')"
    >
      Keep the other
    </button>
  </div>
  <app-conflict-merge (failed)="failed.emit($event)" />
}
