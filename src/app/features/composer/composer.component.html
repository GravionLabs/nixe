<hx-dialog
  [visible]="true"
  (hidden)="composer.close()"
  [ariaLabel]="composer.title()"
  [closable]="false"
  dismissableMask
  position="top"
  size="md"
>
  <form id="composer-form" class="search" (submit)="submit($event)">
    <hx-field [label]="composer.title()">
      <input
        #input
        hx-input
        fluid
        type="text"
        autocomplete="off"
        placeholder="Find a note or type the name of a new one"
        role="combobox"
        aria-expanded="true"
        aria-controls="composer-list"
        [value]="composer.query()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
      />
    </hx-field>
  </form>
  <ul id="composer-list" role="listbox">
    @for (option of composer.options(); track option.path; let i = $index) {
      <li
        role="option"
        [attr.aria-selected]="i === composer.selected()"
        [class.selected]="i === composer.selected()"
      >
        <button
          hx-button
          type="button"
          variant="text"
          severity="secondary"
          size="small"
          fluid
          class="row"
          tabindex="-1"
          (click)="choose(option)"
          [title]="option.path"
        >
          <span class="name">{{ option.create ? "New: " : "" }}{{ option.path }}</span>
        </button>
      </li>
    } @empty {
      <li class="empty">No matching note</li>
    }
  </ul>

  <div hxDialogFooter>
    <button hx-button type="button" variant="text" (click)="composer.close()">Cancel</button>
    <button hx-button type="submit" form="composer-form" [disabled]="!composer.options().length">
      Choose
    </button>
  </div>
</hx-dialog>
