packages:
  - "."
  - extension
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# 7 days, in minutes: a younger release reaches neither the lockfile nor an install (GravionLabs/ci#239).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Own design system: a new helix release installs at once (ADR 0005).
  - "@gravionlabs/helix-*"
  # In the lockfile before the 7 days applied and younger than that on 2026-11-18; remove after 2026-11-20.
  - "@codemirror/lint@6.9.8"
  - "jsdom@31.0.1"
  - "tldts-core@7.5.2"
  - "tldts@7.5.2"
  # Angular 22.3.0 (2026-11-18) is exempt from the 7-day rule on purpose; remove after 2026-11-26.
  - "@angular-devkit/architect@0.2203.0"
  - "@angular-devkit/core@22.3.0"
  - "@angular-devkit/schematics@22.3.0"
  - "@angular/build@22.3.0"
  - "@angular/cdk@22.3.0"
  - "@angular/cli@22.3.0"
  - "@angular/common@22.3.0"
  - "@angular/compiler-cli@22.3.0"
  - "@angular/compiler@22.3.0"
  - "@angular/core@22.3.0"
  - "@angular/forms@22.3.0"
  - "@angular/platform-browser@22.3.0"
  - "@angular/router@22.3.0"
  - "@schematics/angular@22.3.0"
  # Renovate security update: dompurify@3.4.17
  - dompurify@3.4.17
  # Renovate security update: markdown-it@15.0.3
  - markdown-it@15.0.3
patchedDependencies:
  foliate-js@1.0.1: patches/foliate-js@1.0.1.patch
