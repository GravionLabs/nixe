<app-panel-section title="Changes since" storageKey="changes-since">
  <select
    class="range"
    aria-label="Range"
    [value]="changes.kind()"
    (change)="pick($any($event.target).value)"
  >
    <option value="sync" [selected]="changes.kind() === 'sync'">Last sync</option>
    <option value="yesterday" [selected]="changes.kind() === 'yesterday'">Yesterday</option>
    <option value="week" [selected]="changes.kind() === 'week'">Last week</option>
    <option value="commit" [selected]="changes.kind() === 'commit'">Choose a version…</option>
  </select>
  @if (changes.kind() === "commit") {
    <select class="version" aria-label="Version" (change)="pickVersion($any($event.target).value)">
      <option value="" [selected]="!changes.chosen()" disabled>Pick a version</option>
      @for (v of changes.versions(); track v.id) {
        <option [value]="v.id" [selected]="changes.chosen()?.id === v.id">
          {{ versionLabel(v) }}
        </option>
      }
    </select>
    @if (changes.versionsError(); as error) {
      <p class="status">{{ error }}</p>
    }
  }

  @if (changes.message(); as message) {
    <p class="status">{{ message }}</p>
  }
  @if (changes.loading()) {
    <p class="status">Loading…</p>
  }
  <hx-list aria-label="Changed notes">
    @for (change of changes.changes(); track change.path) {
      <app-note-row>
        <button
          hx-list-row
          type="button"
          [current]="isCurrent(change.path)"
          [title]="change.path"
          (click)="changes.compare(change)"
        >
          <app-note-title [path]="change.path" [kind]="change.kind" />
        </button>
        @if (change.kind !== "deleted") {
          <button rowActions type="button" class="open" (click)="open(change)">Open</button>
        }
      </app-note-row>
    }
  </hx-list>
</app-panel-section>
