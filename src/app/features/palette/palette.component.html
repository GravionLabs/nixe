<hx-dialog
  [visible]="true"
  (hidden)="palette.close()"
  ariaLabel="Command palette"
  [closable]="false"
  dismissableMask
  position="top"
  width="min(560px, 90vw)"
>
  <input
    #input
    type="text"
    placeholder="Run a command…"
    aria-label="Find a command by title"
    role="combobox"
    aria-expanded="true"
    aria-controls="palette-list"
    [value]="palette.query()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  <ul id="palette-list" role="listbox">
    @for (command of palette.matches(); track command.id; let i = $index) {
      <li
        role="option"
        [attr.aria-selected]="i === palette.selected()"
        [class.selected]="i === palette.selected()"
      >
        <button type="button" tabindex="-1" (click)="palette.run(command)">
          <span class="name">{{ command.title }}</span>
          @if (shortcuts.keys(command.id); as keys) {
            @if (keys.length) {
              <hx-kbd class="shortcut" [keys]="keys" size="sm" />
            }
          }
        </button>
      </li>
    } @empty {
      <li class="empty">No matching command</li>
    }
  </ul>
  <app-key-hints [hints]="hints" />
</hx-dialog>
