[package]
name = "nixe"
version = "0.1.0"
description = "Nixe – Markdown viewer with Mermaid, Azure DevOps wiki and LaTeX support"
authors = ["Jerome Kaufmann"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nixe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify-debouncer-mini = "0.7"
dunce = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_yaml_ng = "0.10"
ignore = "0.4"
regex = "1"
git2 = { version = "0.21.0", features = ["https", "vendored-libgit2", "vendored-openssl"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
# `nixe mcp`: read-only MCP server over stdio (protocol 2026-07-28, checked against the spec).
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt", "macros", "process"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
ureq = "3"

# Terminal panel (#291): a real PTY (ConPTY on Windows) for the shell; not compiled on mobile.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies.portable-pty]
version = "0.9"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
