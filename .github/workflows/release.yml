name: Build & Release

on:
  push:
    branches: [main]
  # only the release pull request builds the installer matrix; other pull requests run ci.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Release notes from the Conventional Commits since the last stable tag (cliff.toml), as the other
  # GravionLabs repos do. The tag does not exist yet, so --unreleased --tag lists exactly this release.
  release-notes:
    needs: [determine-version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ needs.determine-version.outputs.semver }}

  build:
    needs: [determine-version, test, release-notes]
    if: ${{ !cancelled() && needs.determine-version.result == 'success' && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.release-notes.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.determine-version.outputs.semver }}
      # Only a push to main publishes a release and signs/notarizes the macOS bundles.
      # PRs, workflow_dispatch and other branches build unsigned, publish nothing and get no Apple secret.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIGN_MACOS: ${{ startsWith(matrix.platform, 'macos') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require the Apple signing secrets
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set; refusing to publish an unsigned macOS bundle"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Set release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
          "
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Export the signing variables and write the App Store Connect API key
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          # Placed after `pnpm install` so no install script or earlier build step sees the signing variables.
          # Tauri checks that these variables exist, not that they are non-empty, so they are exported only
          # on a signing run and never set to '' on unsigned runs. Each value is written with a random
          # delimiter, so line breaks in a value cannot end the entry or inject another variable.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "$name<<$delimiter"
              printf '%s\n' "${!name}"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          done
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only builds from main create/update a GitHub release; PRs and other branches
          # just build, to validate the matrix without cutting a release. Kept as a draft
          # here so no platform publishes an incomplete release while the others are
          # still building — publish-release below publishes it once all four are done.
          tagName: ${{ env.PUBLISH == 'true' && format('v{0}', env.VERSION) || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && format('Nixe v{0}', env.VERSION) || '' }}
          releaseBody: ${{ needs.release-notes.outputs.notes }}
          releaseDraft: true
          # The MSI bundler rejects pre-release versions (1.1.0-rc021), so a pre-release builds
          # the Windows installer as NSIS only; stable versions keep every bundle target.
          args: ${{ matrix.args }}${{ matrix.platform == 'windows-latest' && contains(env.VERSION, '-') && ' --bundles nsis' || '' }}
      - name: Verify signature and notarization
        if: env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/*/release/bundle/macos/*.app)
          [ "${#apps[@]}" -gt 0 ] || { echo "::error::no .app bundle found"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv "$app" 2>&1)
            grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::$app has no hardened runtime"; exit 1; }
            xcrun stapler validate "$app"
            spctl -a -vv "$app"
          done
      - name: Remove the API key
        if: always() && env.SIGN_MACOS == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  checksums:
    needs: [determine-version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write, check and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.determine-version.outputs.semver }}"
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$tag" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/assets"
          bash scripts/release-checksums.sh "$RUNNER_TEMP/assets"
          gh release upload "$tag" "$RUNNER_TEMP/assets/SHA256SUMS" --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [determine-version, build, checksums]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.determine-version.outputs.semver }}" \
            --repo "${{ github.repository }}" \
            --draft=false
