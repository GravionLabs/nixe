<div class="row" [class.static]="!interactive">
  @if (interactive) {
    <button
      type="button"
      class="main"
      [title]="path"
      [disabled]="disabled"
      [attr.aria-expanded]="expanded ?? null"
      (click)="activated.emit()"
    >
      @if (kind; as k) {
        <app-status-icon [kind]="k" />
      }
      <span class="title">{{ label.title }}</span>
      @if (label.folder) {
        <span class="folder">{{ label.folder }}</span>
      }
      <ng-content select="[rowEnd]" />
    </button>
  } @else {
    <span class="main" [title]="path">
      @if (kind; as k) {
        <app-status-icon [kind]="k" />
      }
      <span class="title">{{ label.title }}</span>
      @if (label.folder) {
        <span class="folder">{{ label.folder }}</span>
      }
      <ng-content select="[rowEnd]" />
    </span>
  }
  <span class="actions"><ng-content select="[rowActions]" /></span>
</div>
