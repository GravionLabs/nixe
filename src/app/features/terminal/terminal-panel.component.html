<div
  class="resizer"
  role="separator"
  aria-orientation="horizontal"
  aria-label="Resize terminal"
  tabindex="0"
  [attr.aria-valuenow]="height()"
  [attr.aria-valuemin]="min"
  [attr.aria-valuemax]="max()"
  (pointerdown)="dragStart($event)"
  (pointermove)="dragMove($event)"
  (pointerup)="dragEnd($event)"
  (pointercancel)="dragEnd($event)"
  (keydown)="key($event)"
></div>
<div class="tabs" role="tablist" aria-label="Terminals">
  @for (tab of terminal.tabs(); track tab.key) {
    <div class="tab" [class.active]="tab.key === terminal.activeKey()">
      <button
        hx-button
        type="button"
        role="tab"
        class="tab-title"
        variant="text"
        severity="secondary"
        size="small"
        [attr.aria-selected]="tab.key === terminal.activeKey()"
        (click)="terminal.selectTab(tab.key)"
      >
        {{ tab.title }}
      </button>
      <button
        hx-button
        type="button"
        class="tab-close"
        variant="text"
        severity="secondary"
        size="small"
        iconOnly
        [attr.aria-label]="'Close ' + tab.title"
        [hx-tooltip]="'Close ' + tab.title"
        (click)="terminal.closeTab(tab.key)"
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>
  }
  <button
    hx-button
    type="button"
    class="tab-new"
    variant="text"
    severity="secondary"
    size="small"
    iconOnly
    aria-label="New terminal"
    hx-tooltip="New terminal"
    (click)="terminal.newTab()"
  >
    <span aria-hidden="true">+</span>
  </button>
  @for (preset of presets; track preset.id) {
    <button
      hx-button
      type="button"
      class="tab-preset"
      variant="text"
      severity="secondary"
      size="small"
      [hx-tooltip]="preset.commandTitle"
      (click)="terminal.openPreset(preset)"
    >
      {{ preset.title }}
    </button>
  }
</div>
<div class="screens" #screens></div>
@if (terminal.tabs().length === 0) {
  <div class="empty">
    <button
      hx-button
      type="button"
      variant="outlined"
      severity="secondary"
      size="small"
      (click)="terminal.newTab()"
    >
      New terminal
    </button>
  </div>
}
@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}
