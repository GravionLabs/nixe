@if (outline.tree().length === 0) {
  <p class="status">No headings</p>
} @else {
  <div class="levels" role="group" aria-label="Fold the outline">
    <button type="button" class="level" (click)="outline.collapseTo(1)" title="Show only H1">
      H1
    </button>
    <button type="button" class="level" (click)="outline.collapseTo(2)" title="Show down to H2">
      H2
    </button>
    <button type="button" class="level" (click)="outline.collapseTo(3)" title="Show down to H3">
      H3
    </button>
    <button type="button" class="level" (click)="outline.expandAll()" title="Expand all">
      All
    </button>
  </div>
  <hx-list>
    <ul class="tree" role="tree">
      @for (node of visible(); track node.index) {
        <li
          role="treeitem"
          [attr.aria-level]="node.level"
          [attr.aria-selected]="node.index === outline.marked()"
          [attr.aria-expanded]="node.children.length > 0 ? !outline.folded().has(node.index) : null"
        >
          @if (node.children.length > 0) {
            <button
              type="button"
              class="fold"
              [style.left.px]="2 + (node.level - 1) * 12"
              [attr.aria-label]="
                (outline.folded().has(node.index) ? 'Expand ' : 'Collapse ') + node.text
              "
              (click)="outline.toggle(node.index)"
            >
              {{ outline.folded().has(node.index) ? "▸" : "▾" }}
            </button>
          }
          <button
            hx-list-row
            type="button"
            class="heading"
            [current]="node.index === outline.marked() ? 'location' : false"
            [style.padding-left.px]="16 + (node.level - 1) * 12"
            (click)="go(node)"
            (contextmenu)="bookmark($event, node)"
            title="Right-click to bookmark the heading"
          >
            <span class="hx-list-row-label">{{ node.text }}</span>
          </button>
        </li>
      }
    </ul>
  </hx-list>
}
