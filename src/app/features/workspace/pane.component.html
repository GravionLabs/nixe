@if (tab.view() === "settings") {
  <app-settings class="view" />
} @else if (tab.view() === "health") {
  <app-health class="view" (failed)="tabs.notice.set($event)" />
} @else if (doc.path()) {
  @if (editor.editing()) {
    @defer (on immediate) {
      <app-editor class="note" (failed)="tabs.notice.set($event)" />
    }
  } @else {
    <app-viewer
      class="note"
      [html]="html()"
      [dark]="settings.dark()"
      (notify)="tabs.notice.set($event)"
    />
  }
} @else {
  <app-start class="view" (failed)="tabs.notice.set($event)" />
}
