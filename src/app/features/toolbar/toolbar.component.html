<hx-app-toolbar>
  <button slot="start" type="button" class="icon" (click)="doc.back()" [disabled]="!doc.canGoBack()" [title]="'Back (' + mod + '[)'" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
  </button>
  <button slot="start" type="button" class="icon" (click)="doc.forward()" [disabled]="!doc.canGoForward()" [title]="'Forward (' + mod + '])'" aria-label="Forward">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
  </button>

  <span slot="centre" class="name" [title]="doc.path() ?? ''">{{ doc.fileName() }}</span>

  <button
    slot="end"
    type="button"
    class="toggle"
    [class.active]="editor.editing()"
    [attr.aria-pressed]="editor.editing()"
    [disabled]="doc.path() === null || (editor.editing() && editor.blocked())"
    (click)="run('toggle-editor')"
    [title]="'Toggle editor (' + mod + 'E)'"
  >
    <svg viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
    Edit
  </button>
  <button
    slot="end"
    type="button"
    class="icon"
    [class.active]="settings.outlineVisible()"
    [attr.aria-pressed]="settings.outlineVisible()"
    [disabled]="doc.path() === null"
    (click)="run('toggle-outline')"
    [title]="'Toggle outline (' + mod + '⇧L)'"
    aria-label="Toggle outline"
  >
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
  </button>
  <button
    slot="end"
    type="button"
    class="icon"
    [class.active]="settings.backlinksVisible()"
    [attr.aria-pressed]="settings.backlinksVisible()"
    [disabled]="workspace.vaultRoot() === null || doc.path() === null"
    (click)="run('toggle-backlinks')"
    [title]="'Toggle backlinks (' + mod + '⇧B)'"
    aria-label="Toggle backlinks"
  >
    <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1" /></svg>
  </button>
</hx-app-toolbar>
