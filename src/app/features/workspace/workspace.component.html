@for (pane of tabs.panes(); track pane.id; let i = $index) {
  @if (i > 0) {
    <div
      class="divider"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize panes"
      tabindex="0"
      [attr.aria-valuemin]="minPercent"
      [attr.aria-valuemax]="maxPercent"
      [attr.aria-valuenow]="percent()"
      (pointerdown)="startDrag($event)"
      (pointermove)="drag($event)"
      (keydown)="dividerKey($event)"
    ></div>
  }
  <section
    class="pane"
    [class.focused]="tabs.split() && pane.id === tabs.focusedPane().id"
    [style.flex]="tabs.split() ? (i === 0 ? '0 0 ' + tabs.ratio() * 100 + '%' : '1 1 0') : '1 1 0'"
    (pointerdown)="tabs.focusPane(pane.id)"
    (focusin)="tabs.focusPane(pane.id)"
  >
    <hx-tab-bar
      class="tabbar"
      ariaLabel="Open tabs"
      modifiedLabel="Unsaved changes"
      [groupId]="'pane-' + pane.id"
      [tabs]="items(pane)"
      [value]="'' + pane.activeId"
      [menu]="menu()"
      allTabsButton
      missingTitle="File not found"
      (valueChange)="activate(pane, $event)"
      (closed)="closeTab(pane, $event)"
      (moved)="tabs.moveTab(pane.id, $event.from, $event.to)"
      (received)="receive(pane, $event)"
      (menuAction)="onMenu(pane, $event)"
    >
      <button
        hx-button
        type="button"
        variant="text"
        severity="secondary"
        size="small"
        iconOnly
        class="new"
        aria-label="New tab"
        hx-tooltip="New tab"
        [hxTooltipShortcut]="shortcuts.keys('new-tab')"
        (click)="addTab(pane)"
      >
        +
      </button>
    </hx-tab-bar>
    @for (tab of [shown(pane)]; track tab.id) {
      <ng-container *ngComponentOutlet="paneType; injector: tab.injector" />
    }
  </section>
}
